    <div class="atom atom-two" id="atom-two">

        <span class="eye"><span class="pupil"></span></span>
        <span class="eye"><span class="pupil"></span></span>
      </span>
    </div>

    <div class="atom atom-o" id="atom-o">
      <span class="atom-label">O</span>
      <span class="eyes">
        <span class="eye"><span class="pupil"></span></span>
        <span class="eye"><span class="pupil"></span></span>

  <div class="intro-logo" id="intro-logo">
