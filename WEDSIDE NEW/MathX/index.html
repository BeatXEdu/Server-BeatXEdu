<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathX - Booting</title>

  <style>
    :root {
      --bg: #030507;
      --paper: #fcfcfd;
      --paper-line: rgba(70, 80, 90, .07);
      --ink: #11151a;
      --neon: #00eaff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Màn hình Boot Splash */
    .splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 45%, rgba(0,234,255,.065), transparent 24%),
        radial-gradient(circle at 50% 46%, rgba(255,255,255,.018), transparent 45%),
        #030507;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash::before {
      content: "";
      position: absolute;
      width: min(42vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      background: rgba(0, 234, 255, .055);
      filter: blur(80px);
      z-index: -1;
    }

    .scene {
      position: relative;
      width: min(900px, 94vw);
      height: min(670px, 88vh);
      transform: translateY(-2vh);
    }

    /* Paper */
    .paper-shadow {
      position: absolute;
      width: min(520px, 70vw);
      aspect-ratio: 1.42 / 1;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%) rotate(-2.2deg) translate(14px, 25px);
      border-radius: 5px 10px 8px 4px;
      background: rgba(0,0,0,.56);
      filter: blur(28px);
      animation: shadowIn 1s cubic-bezier(.16,.9,.18,1) both;
    }

    .paper {
      position: absolute;
      width: min(520px, 70vw);
      aspect-ratio: 1.42 / 1;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%) rotate(-2.2deg);
      border-radius: 5px 10px 8px 4px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, transparent 0 29px, var(--paper-line) 30px, transparent 31px),
        var(--paper);
      background-size: 100% 30px;
      box-shadow:
        0 25px 65px rgba(0,0,0,.5),
        inset 0 0 0 1px rgba(0,0,0,.055);
      animation: paperIn 1.05s cubic-bezier(.16,.9,.18,1) both;
    }

    .paper::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 14px;
      bottom: 14px;
      width: 2px;
      border-radius: 99px;
      background: linear-gradient(to bottom, #e2e6e9, #f4f6f7);
    }

    .paper::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 32%, rgba(0,0,0,.018), transparent 27%),
        radial-gradient(circle at 70% 68%, rgba(0,0,0,.014), transparent 30%);
      mix-blend-mode: multiply;
    }

    /* Drawing layer */
    .geometry {
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(520px, 70vw);
      aspect-ratio: 1.42 / 1;
      transform: translate(-50%, -50%) rotate(-2.2deg);
      overflow: visible;
    }

    .construction {
      position: absolute;
      inset: 0;
      overflow: visible;
    }

    .ink-shadow {
      stroke: rgba(0,0,0,.16);
      stroke-width: 8;
      fill: none;
      stroke-linecap: round;
      filter: blur(4px);
    }

    .ink {
      stroke: var(--ink);
      stroke-width: 4.6;
      fill: none;
      stroke-linecap: round;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.22));
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawLine 2.35s cubic-bezier(.2,.8,.12,1) .72s forwards;
    }

    .endpoint {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: pointPop .4s cubic-bezier(.17,.89,.32,1.3) forwards;
    }

    .endpoint-a { animation-delay: 1.48s; }
    .endpoint-b { animation-delay: 2.7s; }

    .point-dot {
      fill: var(--ink);
      stroke: #fff;
      stroke-width: 3;
    }

    .point-letter {
      fill: var(--ink);
      font-size: 22px;
      font-weight: 900;
      paint-order: stroke;
      stroke: rgba(255,255,255,.8);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    /* Equation particles */
    .equations {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .equation {
      position: absolute;
      white-space: nowrap;
      color: rgba(255,255,255,.9);
      font-size: clamp(10px, 1.35vw, 14px);
      font-weight: 650;
      letter-spacing: .015em;
      text-shadow: 0 0 10px rgba(0,0,0,.75);
      opacity: 0;
      transform: translate3d(0,0,0) scale(.96);
      animation: equationFly var(--dur) cubic-bezier(.14,.72,.2,1) forwards;
      will-change: transform, opacity;
    }

    .equation::after {
      content: "";
      position: absolute;
      inset: -5px -8px;
      border-radius: 999px;
      background: rgba(0,234,255,.05);
      filter: blur(9px);
      z-index: -1;
    }

    /* Brand */
    .brand {
      position: absolute;
      left: 50%;
      top: calc(48% + min(190px, 25vw));
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      animation: brandIn .72s cubic-bezier(.2,.9,.15,1) 3.15s forwards;
    }

    .logo {
      margin: 0;
      color: #f7fafb;
      font-size: clamp(56px, 9vw, 88px);
      line-height: .88;
      letter-spacing: -.075em;
      font-weight: 950;
      text-shadow: 0 0 25px rgba(0,234,255,.09);
    }

    .logo .x {
      color: var(--neon);
      text-shadow: 0 0 17px rgba(0,234,255,.22);
    }

    .byline {
      margin-top: 15px;
      margin-left: .42em;
      font-size: clamp(10px, 1.65vw, 13px);
      letter-spacing: .42em;
      text-transform: uppercase;
      font-weight: 750;
      color: rgba(241,246,248,.62);
    }

    .accent {
      position: absolute;
      left: 50%;
      top: calc(48% + min(255px, 33vw));
      width: min(170px, 28vw);
      height: 2px;
      transform: translateX(-50%) scaleX(0);
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      opacity: .75;
      animation: accentIn .55s ease-out 3.43s forwards;
    }

    /* Ẩn splash khi hoàn tất */
    .splash.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes shadowIn {
      from { opacity: 0; transform: translate(-50%, -50%) rotate(-2.2deg) translate(0, 45px) scale(.92); }
      to { opacity: 1; transform: translate(-50%, -50%) rotate(-2.2deg) translate(14px, 25px) scale(1); }
    }

    @keyframes paperIn {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-2.2deg) translateY(45px) scale(.94); }
      62% { opacity: 1; transform: translate(-50%, -50%) rotate(-2.2deg) translateY(-4px) scale(1.008); }
      82% { transform: translate(-50%, -50%) rotate(-2.2deg) translateY(2px) scale(.998); }
      100% { opacity: 1; transform: translate(-50%, -50%) rotate(-2.2deg) translateY(0) scale(1); }
    }

    @keyframes drawLine {
      from { stroke-dashoffset: 1; }
      to   { stroke-dashoffset: 0; }
    }

    @keyframes pointPop {
      0%   { opacity: 0; transform: scale(.25); }
      70%  { opacity: 1; transform: scale(1.14); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes equationFly {
      0% { opacity: 0; transform: translate3d(var(--sx), var(--sy), 0) scale(.84) rotate(var(--r)); }
      18% { opacity: .92; }
      100% { opacity: 0; transform: translate3d(var(--ex), var(--ey), 0) scale(1.02) rotate(var(--r2)); }
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateX(-50%) translateY(18px) scale(.965); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes accentIn {
      from { transform: translateX(-50%) scaleX(0); }
      to   { transform: translateX(-50%) scaleX(1); }
    }

    @media (max-height: 660px) {
      .scene { transform: translateY(-4vh) scale(.86); }
      .brand { top: calc(48% + 165px); }
      .accent { top: calc(48% + 230px); }
    }
  </style>
<style>
.back-to-root{position:fixed;left:18px;bottom:18px;z-index:10000;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 13px;border-radius:12px;text-decoration:none;font:700 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:rgba(10,12,18,.88);border:1px solid rgba(0,234,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s ease,border-color .2s ease,background .2s ease}.back-to-root:hover{transform:translateY(-2px);background:rgba(18,24,32,.96);border-color:rgba(0,234,255,.8)}@media(max-width:520px){.back-to-root{left:10px;bottom:10px;padding:8px 10px}}
</style>
<a class="back-to-root" href="/" title="Quay về BeatXEdu">← BeatXEdu</a>
</head>

<body>
  <!-- Màn hình Boot animation -->
  <div class="splash" id="mathxSplash">
    <div class="scene">
      <div class="paper-shadow"></div>
      <div class="paper"></div>

      <div class="geometry">
        <svg class="construction" viewBox="0 0 520 366" preserveAspectRatio="none" aria-hidden="true">
          <line class="ink-shadow" x1="74" y1="286" x2="443" y2="104" pathLength="1"></line>
          <line id="mainLine" class="ink" x1="74" y1="286" x2="443" y2="104" pathLength="1"></line>

          <g class="endpoint endpoint-a">
            <circle class="point-dot" cx="74" cy="286" r="6.5"></circle>
            <text class="point-letter" x="52" y="310">A</text>
          </g>

          <g class="endpoint endpoint-b">
            <circle class="point-dot" cx="443" cy="104" r="6.5"></circle>
            <text class="point-letter" x="451" y="99">B</text>
          </g>
        </svg>
      </div>

      <div class="equations" id="equations" aria-hidden="true"></div>
    </div>

    <div class="brand">
      <h1 class="logo">Math<span class="x">X</span></h1>
      <div style="margin-top:4px;font-size:12px;letter-spacing:2px;opacity:.65">MATHX</div>
      <div class="byline">By BeatXEdu</div>
    </div>

    <div class="accent"></div>
  </div>

  <script>
    (() => {
      // Đường dẫn file trang chủ chính (nằm chung thư mục gốc)
      const TARGET_URL = "home.html"; 
      const DELAY_AFTER_BOOT = 1000; // Đợi 1s sau khi boot xong rồi chuyển hẳn

      const splash = document.getElementById("mathxSplash");
      const scene = document.querySelector(".scene");
      const equations = document.getElementById("equations");
      const line = document.getElementById("mainLine");

      function handleFinish() {
        splash.classList.add("done");

        // Sau khi hoàn thành hiệu ứng boot, tự động chuyển sang trang index.html
        setTimeout(() => {
          window.location.href = TARGET_URL;
        }, DELAY_AFTER_BOOT);
      }

      const oneVar = [
        "2x + 3 = 11", "5x − 7 = 18", "3x + 4 = 16", "7x − 2 = 26",
        "x + 9 = 15", "4x − 5 = 19", "6x + 1 = 25", "9x − 4 = 32"
      ];

      const twoVar = [
        "2x + y = 7", "x − 2y = 4", "3x + 2y = 10", "x + y = 9",
        "2x − 3y = 5", "4x + y = 13", "3x − y = 8", "x + 2y = 6"
      ];

      const allEquations = [...oneVar, ...twoVar];
      const A = { x: 74, y: 286 };
      const B = { x: 443, y: 104 };

      function rand(min, max) { return min + Math.random() * (max - min); }

      function addEquation(t) {
        const rect = line.getBoundingClientRect();
        const sceneRect = scene.getBoundingClientRect();

        const x = rect.left + rect.width * t - sceneRect.left;
        const y = rect.top + rect.height * 0 - sceneRect.top;

        const el = document.createElement("span");
        el.className = "equation";
        el.textContent = allEquations[Math.floor(Math.random() * allEquations.length)];

        const side = Math.random() > .5 ? 1 : -1;
        const sx = rand(-10, 10);
        const sy = rand(-2, 2);
        const ex = rand(30, 78) * side;
        const ey = rand(-45, -14);
        const dur = rand(0.65, 1.15);

        el.style.left = `${x + sx}px`;
        el.style.top = `${y + sy}px`;
        el.style.setProperty("--sx", "0px");
        el.style.setProperty("--sy", "0px");
        el.style.setProperty("--ex", `${ex}px`);
        el.style.setProperty("--ey", `${ey}px`);
        el.style.setProperty("--r", `${rand(-9, 9)}deg`);
        el.style.setProperty("--r2", `${rand(-15, 15)}deg`);
        el.style.setProperty("--dur", `${dur}s`);

        equations.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000 + 80);
      }

      let lastT = 0;
      let drawStart = performance.now() + 720;

      function spawnDuringDraw(timestamp) {
        const elapsed = Math.max(0, timestamp - drawStart);
        const t = Math.min(1, elapsed / 2350);

        if (t - lastT > 0.052 && t < 0.98) {
          addEquation(t);
          lastT = t;
        }

        if (t < 0.98) {
          requestAnimationFrame(spawnDuringDraw);
        }
      }

      window.addEventListener("load", () => {
        setTimeout(() => {
          drawStart = performance.now();
          requestAnimationFrame(spawnDuringDraw);

          setTimeout(() => addEquation(.78), 2150);
          setTimeout(() => addEquation(.9), 2300);
        }, 720);

        // Đếm đúng 3.9s chạy hiệu ứng xong thì gọi hàm chuyển trang
        setTimeout(() => {
          handleFinish();
        }, 3900);
      });

      line.style.strokeDasharray = "1";
      line.style.strokeDashoffset = "1";
    })();
  </script>
</body>
</html>
